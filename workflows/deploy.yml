name: Deploy KDS
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Inject Secrets into app.js
        run: |
          # The 'find' command ensures we hit app.js no matter what folder it is in
          find . -name "app.js" -exec sed -i "s|ZAPIER_WEBHOOK_PLACEHOLDER|${{ secrets.ZAPIER_WEBHOOK_URL }}|g" {} +
          find . -name "app.js" -exec sed -i "s|FIREBASE_API_KEY_PLACEHOLDER|${{ secrets.FIREBASE_API_KEY }}|g" {} +
          find . -name "app.js" -exec sed -i "s|FIREBASE_DB_URL_PLACEHOLDER|${{ secrets.FIREBASE_DB_URL }}|g" {} +
          find . -name "app.js" -exec sed -i "s|FIREBASE_APP_ID_PLACEHOLDER|${{ secrets.FIREBASE_APP_ID }}|g" {} +

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # The folder your index.html is in
