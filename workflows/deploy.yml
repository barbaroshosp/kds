name: Deploy KDS
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Replace Placeholders
        uses: cloudposse/github-action-yaml-config-query@0.1.0 # Or use a standard find/replace action
        # If you prefer keeping it simple with shell, use this rock-solid version:
        run: |
          find kds/ -name "app.js" -exec sed -i "s|SET_API_KEY|${{ secrets.FIREBASE_API_KEY }}|g" {} +
          find kds/ -name "app.js" -exec sed -i "s|SET_DB_URL|${{ secrets.FIREBASE_DB_URL }}|g" {} +
          find kds/ -name "app.js" -exec sed -i "s|SET_APP_ID|${{ secrets.FIREBASE_APP_ID }}|g" {} +
          find kds/ -name "app.js" -exec sed -i "s|ZAPIER_WEBHOOK_PLACEHOLDER|${{ secrets.ZAPIER_WEBHOOK_URL }}|g" {} +

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . # The folder your index.html is in
